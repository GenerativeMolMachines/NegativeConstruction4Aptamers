[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oligonucleotide-negative-benchmark"
version = "0.1.0"
description = "Benchmark for synthetic negative construction under experimental-reference evaluation (ERE)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Anonymous Authors" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "torch>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "lightgbm",
  "rdkit",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyarrow>=14.0",
  "transformers>=4.36",
  "tqdm>=4.66",
  "python-Levenshtein>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
